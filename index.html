'use strict';
const DATA={"S": [{"text": "It’s easy to adopt eco-friendly habits, and you can always start at home.", "p": 0, "c": ["It’s easy", "to adopt eco-friendly habits,", "and you can always", "start at home."], "vi": "Bạn có thể dễ dàng hình thành các thói quen thân thiện với môi trường và luôn có thể bắt đầu ngay tại nhà."}, {"text": "Here are three tips to help you.", "p": 0, "c": ["Here are", "three tips", "to help you."], "vi": "Dưới đây là ba mẹo giúp bạn làm điều đó."}, {"text": "There are so many electrical appliances around us, so if we could save even a little amount of energy from each appliance, it would add up to a lot.", "p": 1, "c": ["There are so many electrical appliances", "around us,", "so if we could save", "even a little amount of energy", "from each appliance,", "it would add up to a lot."], "vi": "Có rất nhiều thiết bị điện xung quanh chúng ta; vì thế, nếu tiết kiệm được dù chỉ một chút năng lượng từ mỗi thiết bị, tổng lượng tiết kiệm sẽ rất đáng kể."}, {"text": "For example, there are likely to be tens of light bulbs in your house, so if you can replace them with LED ones, which are more energy-efficient and long-lasting light bulbs, you would save a lot of electricity.", "p": 1, "c": ["For example,", "there are likely to be", "tens of light bulbs in your house,", "so if you can replace them", "with LED ones,", "which are more energy-efficient", "and long-lasting light bulbs,", "you would save a lot of electricity."], "vi": "Chẳng hạn, trong nhà bạn có thể có hàng chục bóng đèn; nếu thay chúng bằng bóng LED, loại bóng tiết kiệm năng lượng hơn và có tuổi thọ cao hơn, bạn sẽ tiết kiệm được nhiều điện."}, {"text": "Before you buy a new appliance, you should also check its energy star rating, which shows how much energy it will use in a year.", "p": 1, "c": ["Before you buy a new appliance,", "you should also check", "its energy star rating,", "which shows", "how much energy it will use", "in a year."], "vi": "Trước khi mua một thiết bị mới, bạn cũng nên kiểm tra mức xếp hạng sao năng lượng, cho biết lượng năng lượng thiết bị sử dụng trong một năm."}, {"text": "It’s easy to understand: the more stars there are, the more energy you can save!", "p": 1, "c": ["It’s easy to understand:", "the more stars there are,", "the more energy", "you can save!"], "vi": "Quy tắc rất dễ hiểu: càng nhiều sao, bạn càng tiết kiệm được nhiều năng lượng!"}, {"text": "To reduce your carbon footprint, you should also turn off the lights when you leave a room.", "p": 2, "c": ["To reduce your carbon footprint,", "you should also", "turn off the lights", "when you leave a room."], "vi": "Để giảm dấu chân carbon, bạn cũng nên tắt đèn khi ra khỏi phòng."}, {"text": "In addition, keep your windows or curtains open during the day to let natural sunlight in, or place more mirrors near a lamp to maximise lighting in the house.", "p": 2, "c": ["In addition,", "keep your windows or curtains open", "during the day", "to let natural sunlight in,", "or place more mirrors", "near a lamp", "to maximise lighting", "in the house."], "vi": "Ngoài ra, hãy mở cửa sổ hoặc rèm vào ban ngày để ánh sáng tự nhiên chiếu vào, hoặc đặt thêm gương gần đèn để tối ưu ánh sáng trong nhà."}, {"text": "This can also help to reduce both energy consumption and your energy bills.", "p": 2, "c": ["This can also help", "to reduce", "both energy consumption", "and your energy bills."], "vi": "Việc này cũng giúp giảm cả mức tiêu thụ năng lượng lẫn hóa đơn năng lượng của bạn."}, {"text": "While many people already know that turning off appliances around the house when they finish using them can save energy, they may not know that it is even better to unplug them.", "p": 3, "c": ["While many people already know", "that turning off appliances", "around the house", "when they finish using them", "can save energy,", "they may not know", "that it is even better", "to unplug them."], "vi": "Mặc dù nhiều người đã biết rằng tắt thiết bị trong nhà sau khi dùng xong có thể tiết kiệm năng lượng, họ có thể chưa biết rằng rút phích cắm còn tốt hơn."}, {"text": "It is estimated that we could save up to 10% of our electricity bills every month simply by unplugging appliances when they’re not in use.", "p": 3, "c": ["It is estimated", "that we could save", "up to 10% of our electricity bills", "every month", "simply by unplugging appliances", "when they’re not in use."], "vi": "Ước tính chúng ta có thể tiết kiệm tới 10% tiền điện mỗi tháng chỉ bằng cách rút phích cắm các thiết bị khi không sử dụng."}, {"text": "This is especially true for chargers.", "p": 3, "c": ["This is especially true", "for chargers."], "vi": "Điều này đặc biệt đúng với các bộ sạc."}, {"text": "Many people tend to leave their fully charged phones connected, not knowing that it consumes around 2.24 watts.", "p": 3, "c": ["Many people tend to", "leave their fully charged phones connected,", "not knowing", "that it consumes", "around 2.24 watts."], "vi": "Nhiều người thường để điện thoại đã sạc đầy vẫn kết nối với nguồn điện mà không biết việc này tiêu thụ khoảng 2,24 watt."}, {"text": "The figure goes up to 29.84 watts for laptops and computers.", "p": 3, "c": ["The figure goes up to", "29.84 watts", "for laptops and computers."], "vi": "Con số này tăng lên 29,84 watt đối với máy tính xách tay và máy tính."}, {"text": "Leaving an empty charger plugged in has a similar effect, so make unplugging a habit!", "p": 3, "c": ["Leaving an empty charger plugged in", "has a similar effect,", "so make unplugging", "a habit!"], "vi": "Để bộ sạc không kết nối với thiết bị vẫn cắm điện cũng có tác động tương tự; vì thế, hãy tạo thói quen rút phích cắm!"}], "Q": [{"text": "Which of the following is the best heading for Section A?", "opts": ["Replace your light bulbs in your house!", "LED light bulbs are the best!", "Use energy-efficient light bulbs and appliances!", "Check the energy stars!"], "key": 2, "ev": [3, 4], "quotes": ["replace them with LED ones", "check its energy star rating"], "why": "C covers both light bulbs and other appliances. A heading must cover the whole section.", "vwhy": "C bao quát cả bóng đèn và thiết bị điện. Tiêu đề phải chứa toàn bộ ý chính của đoạn.", "other": "A / B: only light bulbs. D: only the star rating.", "vother": "A/B chỉ nói bóng đèn; D chỉ nói xếp hạng sao. Đều thiếu một phần nội dung.", "chunks": [["energy-efficient appliances", "thiết bị tiết kiệm năng lượng"], ["replace something with something", "thay thứ gì bằng thứ khác"], ["energy star rating", "mức xếp hạng sao năng lượng"]]}, {"text": "Which of the following is the best heading for Section B?", "opts": ["Don’t keep lights on all the time, but improve home lighting.", "Turn off the lights when you’re out.", "Use simple tricks around the house.", "Reduce your energy bills by keeping windows open."], "key": 0, "ev": [6, 7], "quotes": ["turn off the lights when you leave a room", "let natural sunlight in", "maximise lighting in the house"], "why": "A includes both switching off unnecessary lights and improving home lighting.", "vwhy": "A chứa đủ hai ý: tắt đèn khi không cần và cải thiện ánh sáng trong nhà.", "other": "B: only switching lights off. C: too general. D: only one detail; open windows are used to let sunlight in.", "vother": "B thiếu ý cải thiện ánh sáng; C quá chung; D chỉ lấy một chi tiết về mở cửa sổ.", "chunks": [["let natural sunlight in", "để ánh sáng tự nhiên chiếu vào"], ["maximise lighting", "tối ưu hiệu quả chiếu sáng"], ["reduce energy consumption", "giảm mức tiêu thụ năng lượng"]]}, {"text": "Which of the following is the best heading for Section C?", "opts": ["Turn off unused appliances.", "Turn off and unplug appliances when not in use.", "Chargers should be unplugged.", "Laptops and computers consume more energy than you thought."], "key": 1, "ev": [9, 10], "quotes": ["it is even better to unplug them", "unplugging appliances when they’re not in use"], "why": "B covers switching appliances off and unplugging them. The section stresses unplugging.", "vwhy": "B bao quát cả tắt thiết bị và rút phích cắm; đoạn đặc biệt nhấn mạnh việc rút điện.", "other": "A: leaves out unplugging. C: only chargers. D: only the laptop/computer example.", "vother": "A thiếu rút phích cắm; C chỉ nói bộ sạc; D chỉ là một ví dụ.", "chunks": [["unplug appliances", "rút phích cắm thiết bị"], ["when not in use", "khi không sử dụng"], ["make something a habit", "biến việc gì thành thói quen"]]}, {"text": "Why should people try to save even a small amount of energy when using home appliances?", "opts": ["Because they often use the most energy in the house.", "Because there are a lot of them around the house.", "Because they are simple and easy to understand.", "Because they are energy-efficient and long-lasting."], "key": 1, "ev": [2], "quotes": ["so many electrical appliances around us", "add up to a lot"], "why": "Small savings from many appliances add up to a large total.", "vwhy": "Tiết kiệm một chút ở nhiều thiết bị sẽ cộng dồn thành một lượng đáng kể.", "other": "A: “the most energy” is not stated. C: easy to understand describes the star rating. D: describes LED bulbs.", "vother": "A không được nêu; C nói về cách hiểu xếp hạng sao; D mô tả bóng LED.", "chunks": [["electrical appliances", "thiết bị điện"], ["add up to a lot", "cộng dồn thành lượng đáng kể"]]}, {"text": "It can be inferred from the passage that an appliance rated five energy stars ________ than another one rated two stars.", "opts": ["is more expensive", "is more advanced", "consumes more energy", "consumes less energy"], "key": 3, "ev": [5], "quotes": ["the more stars there are, the more energy you can save"], "why": "More stars mean more energy saved, so a five-star appliance uses less energy than a two-star one.", "vwhy": "Nhiều sao hơn nghĩa là tiết kiệm hơn; thiết bị năm sao tiêu thụ ít năng lượng hơn thiết bị hai sao.", "other": "A / B: no information about price or technology. C: reverses the meaning.", "vother": "A/B không có thông tin về giá hoặc công nghệ; C ngược ý bài.", "chunks": [["consume less energy", "tiêu thụ ít năng lượng hơn"], ["the more …, the more …", "càng …, càng …"]]}, {"text": "It can be inferred from the passage that saving energy with home appliances can also help us to ________.", "opts": ["improve home lighting", "charge mobile phones faster", "be safe at home", "save money"], "key": 3, "ev": [8, 10], "quotes": ["reduce both energy consumption and your energy bills", "save up to 10% of our electricity bills every month"], "why": "Lower energy bills mean spending less money. This is a direct inference from the passage.", "vwhy": "Giảm hóa đơn năng lượng nghĩa là chi ít tiền hơn, tức tiết kiệm tiền.", "other": "A: one lighting measure, not the general result. B: faster charging is not mentioned. C: safety is not discussed.", "vother": "A chỉ là một biện pháp về ánh sáng; B không có thông tin sạc nhanh; C không bàn về an toàn.", "chunks": [["reduce energy bills", "giảm chi phí năng lượng"], ["save money", "tiết kiệm tiền"]]}, {"text": "Up to 10% of electricity could be saved if we ________.", "opts": ["turn off lights", "turn off electrical appliances when not in use", "unplug electrical appliances when not in use", "unplug phones and laptops when they are fully charged"], "key": 2, "ev": [10], "quotes": ["save up to 10% of our electricity bills every month", "unplugging appliances when they’re not in use"], "why": "C matches the action linked to 10%: unplug appliances when they are not being used. The passage actually gives 10% of electricity bills.", "vwhy": "C khớp hành động gắn với 10%: rút phích cắm khi không dùng. Chính xác hơn, bài nói 10% tiền điện.", "other": "A / B: not the action linked to 10%. D: only phones and laptops, narrower than appliances.", "vother": "A/B không phải hành động gắn với 10%; D thu hẹp thành điện thoại và laptop.", "chunks": [["up to 10%", "lên tới 10%"], ["unplugging appliances when they’re not in use", "rút phích cắm thiết bị khi không sử dụng"]]}, {"text": "It function reading(el){let html='';for(let p=0;p<4;p++){if(p)html+=`<div class="section-label">${'ABC'[p-1]}. ________</div>`;html+='<p>';S.forEach((s,i)=>{if(s.p!==p)return;const ranges=phrases.map(x=>[s.text.indexOf(x),x.length]).filter(x=>x[0]>=0);html+=`<span data-sentence="${i}">`;Array.from(s.text).forEach((c,j)=>{html+=`<span data-char="${i}:${j}"${ranges.some(([a,l])=>j>=a&&j<a+l)?' class="advanced"':''}>${esc(c)}</span>`});html+='</span> ';});html+=`</p><div class="vi" lang="vi">${S.filter(s=>s.p===p).map(s=>esc(s.vi)).join(' ')}</div>`;}el.innerHTML=html;}
